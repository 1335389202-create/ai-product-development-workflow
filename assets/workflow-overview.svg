<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">AI Product Development Workflow overview</title>
  <desc id="workflow-desc">Discover, Design, Validate, Build, Release, and Learn stages connected in sequence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="880" rx="20" fill="#f8fafc"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 320 130 L 320 190"/>
    <path d="M 320 270 L 320 330"/>
    <path d="M 320 410 L 320 470"/>
    <path d="M 320 550 L 320 610"/>
    <path d="M 320 690 L 320 750"/>
  </g>
  <g fill="#475569" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">
    <text x="380" y="166">Leads to</text>
    <text x="380" y="306">Leads to</text>
    <text x="380" y="446">Leads to</text>
    <text x="380" y="586">Leads to</text>
    <text x="380" y="726">Leads to</text>
  </g>
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    <g><rect x="170" y="50" width="300" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="320" y="99" fill="#0f172a">Discover</text></g>
    <g><rect x="170" y="190" width="300" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="320" y="239" fill="#0f172a">Design</text></g>
    <g><rect x="170" y="330" width="300" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="320" y="379" fill="#0f172a">Validate</text></g>
    <g><rect x="170" y="470" width="300" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="320" y="519" fill="#0f172a">Build</text></g>
    <g><rect x="170" y="610" width="300" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="320" y="659" fill="#0f172a">Release</text></g>
    <g><rect x="170" y="750" width="300" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="320" y="799" fill="#0f172a">Learn</text></g>
  </g>
</svg>