<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">AI Product Development Workflow — 6 Stages, 4 Gates, Iteration Loop</title>
  <desc id="workflow-desc">Discover and Define feed through the Scope Gate into Design. Design crosses the Design Gate into Build. Build crosses the Build Gate into Validate. Validate crosses the Release Gate into Release &amp; Learn. Release &amp; Learn loops back to start the next iteration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#92400e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="640" height="960" rx="20" fill="#f8fafc"/>

  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 320 114 L 320 138"/>
    <path d="M 320 202 L 320 226"/>
    <path d="M 320 274 L 320 298"/>
    <path d="M 320 362 L 320 386"/>
    <path d="M 320 434 L 320 458"/>
    <path d="M 320 522 L 320 546"/>
    <path d="M 320 594 L 320 618"/>
    <path d="M 320 682 L 320 706"/>
    <path d="M 320 754 L 320 778"/>
  </g>

  <g fill="none" stroke="#92400e" stroke-width="2.5" marker-end="url(#arrow-amber)">
    <path d="M 500 810 C 580 810, 580 80, 500 80 L 470 82"/>
  </g>
  <g fill="#92400e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-style="italic" text-anchor="middle">
    <text x="596" y="450" transform="rotate(90 596 450)">Next Iteration</text>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">

    <g filter="url(#shadow)">
      <rect x="140" y="50" width="360" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="320" y="91" font-size="22" font-weight="600" fill="#0f172a">Discover</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="140" y="138" width="360" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="320" y="179" font-size="22" font-weight="600" fill="#0f172a">Define</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="180" y="226" width="280" height="48" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
      <text x="320" y="246" font-size="13" font-weight="600" fill="#78350f">G1</text>
      <text x="320" y="266" font-size="17" font-weight="700" fill="#92400e">Scope Gate</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="140" y="298" width="360" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="320" y="339" font-size="22" font-weight="600" fill="#0f172a">Design</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="180" y="386" width="280" height="48" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
      <text x="320" y="406" font-size="13" font-weight="600" fill="#78350f">G2</text>
      <text x="320" y="426" font-size="17" font-weight="700" fill="#92400e">Design Gate</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="140" y="458" width="360" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="320" y="499" font-size="22" font-weight="600" fill="#0f172a">Build</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="180" y="546" width="280" height="48" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
      <text x="320" y="566" font-size="13" font-weight="600" fill="#78350f">G3</text>
      <text x="320" y="586" font-size="17" font-weight="700" fill="#92400e">Build Gate</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="140" y="618" width="360" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="320" y="659" font-size="22" font-weight="600" fill="#0f172a">Validate</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="180" y="706" width="280" height="48" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
      <text x="320" y="726" font-size="13" font-weight="600" fill="#78350f">G4</text>
      <text x="320" y="746" font-size="17" font-weight="700" fill="#92400e">Release Gate</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="140" y="778" width="360" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="320" y="809" font-size="22" font-weight="600" fill="#0f172a">Release &amp; Learn</text>
    </g>

  </g>
</svg>
